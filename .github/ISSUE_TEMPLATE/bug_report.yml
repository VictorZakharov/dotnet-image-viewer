name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve ImageViewer.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the release version or commit hash when known.
  - type: input
    id: operating_system
    attributes:
      label: Operating system and version
      placeholder: Windows 11 24H2, Ubuntu 24.04, etc.
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Add screenshots, logs, and relevant media metadata. Do not upload private media.
